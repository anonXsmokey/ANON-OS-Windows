name: Build ANON OS Windows ISO

on:
  workflow_dispatch:
    inputs:
      windows_iso_url:
        description: 'Official Windows 11 x64 ISO URL'
        required: true
        type: string
      image_index:
        description: 'Windows image index'
        required: false
        default: '1'
        type: string
      architecture:
        description: 'Target architecture'
        required: false
        default: x64
        type: choice
        options: [x64]

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-iso:
    name: Build + validate ANON OS ISO
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install oscdimg
        shell: pwsh
        run: |
          choco install windows-adk-oscdimg -y --no-progress
          $oscdimg = Get-ChildItem 'C:\Program Files (x86)\Windows Kits' -Filter oscdimg.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $oscdimg) { throw 'oscdimg.exe was not found after ADK installation.' }
          "OSCDIMG_PATH=$($oscdimg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Download Windows source ISO
        shell: pwsh
        env:
          WINDOWS_ISO_URL: ${{ inputs.windows_iso_url }}
        run: |
          $dir="$env:GITHUB_WORKSPACE\build\input";New-Item -ItemType Directory -Force $dir|Out-Null
          $iso="$dir\windows-source.iso"
          Invoke-WebRequest -Uri $env:WINDOWS_ISO_URL -OutFile $iso -UseBasicParsing
          if((Get-Item $iso).Length -lt 4000000000){throw 'Downloaded Windows ISO is unexpectedly small.'}
          Get-FileHash $iso -Algorithm SHA256 | Tee-Object "$dir\SOURCE-SHA256.txt"
      - name: Publish ANON shell
        shell: pwsh
        run: |
          dotnet restore ux/shell/M0/ANON.Shell.M0.csproj --runtime win-x64
          dotnet publish ux/shell/M0/ANON.Shell.M0.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output "$env:GITHUB_WORKSPACE\build\shell-publish"
          if(-not(Test-Path "$env:GITHUB_WORKSPACE\build\shell-publish\ANON.Shell.M0.exe")){throw 'ANON Shell publish failed.'}
      - name: Assemble ISO
        shell: pwsh
        env:
          OSCDIMG_PATH: ${{ env.OSCDIMG_PATH }}
        run: |
          & .\build\assembly\build-iso.ps1 -WindowsIso "$env:GITHUB_WORKSPACE\build\input\windows-source.iso" -ShellPublish "$env:GITHUB_WORKSPACE\build\shell-publish" -OutputRoot "$env:GITHUB_WORKSPACE\build\out" -Architecture '${{ inputs.architecture }}' -ImageIndex ([int]'${{ inputs.image_index }}')
      - name: Validate ISO
        shell: pwsh
        run: |
          $iso=Get-ChildItem .\build\out\ANON-OS-Windows-*.iso|Select-Object -First 1
          if(-not$iso){throw 'ANON OS ISO was not produced.'}
          & .\build\assembly\validate-iso.ps1 -IsoPath $iso.FullName -ExpectedArchitecture '${{ inputs.architecture }}'
      - name: Generate release manifest
        shell: pwsh
        run: |
          $iso=Get-ChildItem .\build\out\ANON-OS-Windows-*.iso|Select-Object -First 1
          & .\build\assembly\release-manifest.ps1 -IsoPath $iso.FullName
      - name: Upload ISO candidate
        uses: actions/upload-artifact@v4
        with:
          name: ANON-OS-Windows-ISO
          path: |
            build/out/*.iso
            build/out/*.txt
            build/out/*.json
          if-no-files-found: error
          retention-days: 14
