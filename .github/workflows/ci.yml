name: ANON OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  RID: 'win-x64'

jobs:
  core-build:
    name: Build ANON Core
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore core
        run: dotnet restore core/Anon.Os.Core.csproj --runtime ${{ env.RID }}
      - name: Build core
        run: dotnet build core/Anon.Os.Core.csproj --configuration Release --no-restore --runtime ${{ env.RID }}

  ai-build:
    name: Build ANON AI safety layer
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore AI
        run: dotnet restore ai/Anon.Os.Ai.csproj --runtime ${{ env.RID }}
      - name: Build AI
        run: dotnet build ai/Anon.Os.Ai.csproj --configuration Release --no-restore --runtime ${{ env.RID }}
      - name: Verify canonical AI sources
        shell: pwsh
        run: |
          $required = @(
            'ai/Contracts.cs',
            'ai/OpenAiCompatibleProvider.cs',
            'ai/runtime/AiActionContract.cs'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Canonical AI source missing: $file" }
          }
          if (Test-Path 'anon-ai') { throw 'Duplicate anon-ai implementation must not ship.' }
          $contract = Get-Content 'ai/runtime/AiActionContract.cs' -Raw
          foreach ($requiredToken in @('ReadOnly','UserConfirmed','SystemChange','IAiActionExecutor','AiActionGate')) {
            if ($contract -notmatch [regex]::Escape($requiredToken)) { throw "AI safety contract missing: $requiredToken" }
          }
          Write-Host 'Canonical AI + compiled safety boundary PASS'

  shell-build:
    name: Build ANON Shell + Bootstrap + Performance Pet
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore shell
        run: dotnet restore ux/shell/M0/ANON.Shell.M0.csproj --runtime ${{ env.RID }}
      - name: Build shell
        run: dotnet build ux/shell/M0/ANON.Shell.M0.csproj --configuration Release --no-restore --runtime ${{ env.RID }}
      - name: Validate M0 publish contract
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'ux/shell/M0/ANON.Shell.M0.csproj' -Raw
          $text = Get-Content 'ux/shell/M0/ANON.Shell.M0.csproj' -Raw
          foreach ($token in @(
            '<WindowsPackageType>None</WindowsPackageType>',
            '<WindowsAppSDKSelfContained>true</WindowsAppSDKSelfContained>',
            '<EnableMsixTooling>true</EnableMsixTooling>',
            '<SelfContained>true</SelfContained>',
            '<PublishTrimmed>false</PublishTrimmed>',
            '<PublishSingleFile>false</PublishSingleFile>',
            '<PublishReadyToRun>false</PublishReadyToRun>'
          )) {
            if ($text -notmatch [regex]::Escape($token)) { throw "M0 publish contract missing: $token" }
          }
          Write-Host 'M0 unpackaged self-contained publish contract PASS'
      - name: Publish shell
        run: dotnet publish ux/shell/M0/ANON.Shell.M0.csproj --configuration Release --runtime ${{ env.RID }} --self-contained true --no-restore --output build/ci-shell -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=false -p:PublishSingleFile=false -p:PublishReadyToRun=false
      - name: Restore bootstrap
        run: dotnet restore ux/shell/Bootstrap/ANON.Shell.Bootstrap.csproj --runtime ${{ env.RID }}
      - name: Build bootstrap
        run: dotnet build ux/shell/Bootstrap/ANON.Shell.Bootstrap.csproj --configuration Release --no-restore --runtime ${{ env.RID }}
      - name: Publish bootstrap
        run: dotnet publish ux/shell/Bootstrap/ANON.Shell.Bootstrap.csproj --configuration Release --runtime ${{ env.RID }} --self-contained true --no-restore --output build/ci-bootstrap
      - name: Restore Performance Pet
        run: dotnet restore ux/shell/PerformancePet/ANON.PerformancePet.csproj --runtime ${{ env.RID }}
      - name: Build Performance Pet
        run: dotnet build ux/shell/PerformancePet/ANON.PerformancePet.csproj --configuration Release --no-restore --runtime ${{ env.RID }}
      - name: Publish Performance Pet
        run: dotnet publish ux/shell/PerformancePet/ANON.PerformancePet.csproj --configuration Release --runtime ${{ env.RID }} --self-contained true --no-restore --output build/ci-performance-pet
      - name: Verify payload
        shell: pwsh
        run: |
          $shell = Resolve-Path build/ci-shell/ANON.Shell.M0.exe -ErrorAction SilentlyContinue
          $bootstrap = Resolve-Path build/ci-bootstrap/ANON.Shell.Bootstrap.exe -ErrorAction SilentlyContinue
          $pet = Resolve-Path build/ci-performance-pet/ANON.PerformancePet.exe -ErrorAction SilentlyContinue
          if (-not $shell) { throw 'ANON.Shell.M0.exe was not produced.' }
          if (-not $bootstrap) { throw 'ANON.Shell.Bootstrap.exe was not produced.' }
          if (-not $pet) { throw 'ANON.PerformancePet.exe was not produced.' }
          Write-Host 'Shell + bootstrap + performance pet build PASS'
      - name: Validate installer scripts and answer file syntax
        shell: pwsh
        run: |
          $files = @(
            'build/assembly/build-iso.ps1',
            'build/assembly/build-local.ps1',
            'build/assembly/validate-iso.ps1',
            'build/assembly/release-manifest.ps1',
            'build/assembly/validate-release-gates.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "PowerShell syntax validation failed: $file`n$($errors | Out-String)" }
          }
          $xml = Get-Content build/assembly/Autounattend.xml -Raw
          [xml]$xml | Out-Null
          if ($xml -notmatch 'windowsPE' -or $xml -notmatch 'oobeSystem' -or $xml -notmatch '/IMAGE/INDEX') { throw 'Autounattend.xml is missing a required deployment pass.' }
          if ($xml -match 'CurrentVersion\\Winlogon.*Shell') { throw 'Autounattend must not replace the Winlogon shell.' }
          if ($xml -notmatch 'HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run' -or $xml -notmatch 'ANONShell' -or $xml -notmatch 'ANON\.Shell\.Bootstrap\.exe') { throw 'Autounattend is missing the safe per-user ANON launcher contract.' }
          Write-Host 'Installer PowerShell + Autounattend XML + safe launcher syntax PASS'
      - name: Validate installer contract consistency
        shell: pwsh
        run: |
          $builder = Get-Content build/assembly/build-iso.ps1 -Raw
          $validator = Get-Content build/assembly/validate-iso.ps1 -Raw
          $answer = Get-Content build/assembly/Autounattend.xml -Raw
          $requiredBridge = '%SYSTEMDRIVE%\sources\setup.exe, /legacy'
          $requiredLaunch = 'Launch: %SYSTEMDRIVE%\sources\setup.exe /legacy'
          if (-not $builder.Contains($requiredBridge)) { throw 'Builder is missing the exact SYSTEMDRIVE legacy Setup bridge.' }
          if (-not $builder.Contains('ANON legacy Setup bridge enabled.')) { throw 'Builder is missing the WinPE legacy Setup marker.' }
          if (-not $builder.Contains($requiredLaunch)) { throw 'Builder marker does not describe the expected Setup launch contract.' }
          if ($validator -notmatch '%SYSTEMDRIVE%.*sources.*setup') { throw 'Validator is missing the WinPE SYSTEMDRIVE Setup path contract.' }
          if ($answer -match 'CurrentVersion\\Winlogon.*Shell') { throw 'Installer contract still attempts to replace Winlogon Shell.' }
          if ($answer -notmatch 'HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run') { throw 'Installer contract lacks the per-user ANON launcher.' }
          if ($builder -notmatch 'bootOrderCandidates') { throw 'Builder must derive oscdimg optimization hints from existing files.' }
          if ($builder -match 'FirstLogonCommands\s*->\s*Winlogon') { throw 'Builder documentation still claims ANON replaces Winlogon Shell.' }
          Write-Host 'Installer bridge + safe desktop launcher contract consistency PASS'
      - name: Verify optimization policy code shape
        shell: pwsh
        run: |
          $files = @(
            'performance/optimization/OptimizationProfile.cs',
            'performance/optimization/OptimizationPolicyEngine.cs',
            'performance/optimization/OptimizationPlan.cs'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Optimization source missing: $file" }
            $text = Get-Content $file -Raw
            if ($text -notmatch 'Restore' -and $text -notmatch 'Reversible') { throw "Optimization source lacks a rollback/reversibility marker: $file" }
          }
          Write-Host 'Optimization source safety gate PASS'
      - name: Validate M0 UI contract
        shell: pwsh
        run: |
          $xaml = Get-Content 'ux/shell/M0/MainWindow.xaml' -Raw
          $code = Get-Content 'ux/shell/M0/MainWindow.xaml.cs' -Raw
          $theme = Get-Content 'ux/shell/M0/Themes/AnonTheme.xaml' -Raw
          $requiredXaml = @(
            'SearchBox', 'LauncherPanel', 'GamingModeButton', 'VisualProfile',
            'ReducedMotion', 'FirstRunOverlay', 'FirstRunTheme', 'FirstRunProfile',
            'Files_Click', 'Apps_Click', 'Games_Click', 'Ai_Click', 'System_Click'
          )
          foreach ($token in $requiredXaml) {
            if ($xaml -notmatch [regex]::Escape($token)) { throw "M0 UI contract missing XAML token: $token" }
          }
          foreach ($handler in @('SearchBox_TextChanged','SearchBox_KeyDown','LauncherResults_ItemClick','Play_Click','ReducedMotion_Click','CompleteFirstRun_Click','SkipFirstRun_Click')) {
            if ($code -notmatch [regex]::Escape($handler)) { throw "M0 UI contract missing handler: $handler" }
          }
          foreach ($style in @('AnonPrimaryButtonStyle','AnonSecondaryButtonStyle','AnonNavButtonStyle','AnonIconButtonStyle','AnonSearchBoxStyle')) {
            if ($theme -notmatch [regex]::Escape($style)) { throw "M0 theme contract missing style: $style" }
          }
          if ($code -notmatch 'GamingModeButton\.Content\s*=') { throw 'Gaming Mode button is not synchronized with runtime state.' }
          if ($code -notmatch 'SearchBox\.Width\s*=\s*double\.NaN') { throw 'Launcher search is fixed-width and may clip on compact displays.' }
          if ($code -notmatch 'unavailable') { throw 'Telemetry failure state is not explicitly handled.' }
          Write-Host 'M0 UI contract + accessibility/responsive/failure-state checks PASS'
      - name: Repository diff hygiene
        shell: bash
        run: git diff --check --exit-code
